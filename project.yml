# XcodeGen spec: run `xcodegen` in this folder to create MarbleComposer.xcodeproj
name: MarbleComposer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  MarbleComposer:
    type: application
    platform: iOS
    sources: [MarbleComposer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.marblecomposer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Marble Composer
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
