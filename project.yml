# XcodeGen spec: run `xcodegen` in this folder to create MarbleJam.xcodeproj
name: MarbleJam
options:
  bundleIdPrefix: com.marblejam
  deploymentTarget:
    iOS: "17.0"
targets:
  MarbleJam:
    type: application
    platform: iOS
    sources:
      - path: MarbleJam
        excludes: ["Products.storekit"]       # the local test store: used by the Run scheme and the tests, never shipped
      - path: MarbleJamBackgrounds      # made by tools/prepare_backgrounds.swift, kept out of git
        type: folder
        buildPhase: resources
    entitlements:
      path: MarbleJam/MarbleJam.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.icloud-container-identifiers: [iCloud.com.marblejam.app]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.marblejam.app]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marblejam.app
        DEVELOPMENT_TEAM: G53XBRCRVU
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-halloween AppIcon-thanksgiving AppIcon-christmas AppIcon-newyear AppIcon-valentines AppIcon-stpatricks AppIcon-easter AppIcon-muertos"   # holiday icons, switched by AppIcons
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES                   # portrait-only on iPad must opt out of multitasking, or the upload is refused (ITMS-90474); deprecated in iOS 26, revisit with the iOS 27 SDK
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO           # no encryption beyond what iOS provides: no export-compliance questions per build
        INFOPLIST_KEY_CFBundleDisplayName: Marble Beats
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"          # laying out songs and rendering notes is ~30x slower unoptimised; nobody steps through this code
  MarbleJamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MarbleJamTests
      - path: MarbleJam/Products.storekit        # StoreKitTest loads it from the test bundle
        buildPhase: resources
    dependencies:
      - target: MarbleJam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: G53XBRCRVU
schemes:
  MarbleJam:
    build:
      targets:
        MarbleJam: all
        MarbleJamTests: [test]
    run:
      storeKitConfiguration: MarbleJam/Products.storekit   # local test store until the products exist in App Store Connect
    test:
      targets: [MarbleJamTests]
