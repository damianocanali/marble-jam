# XcodeGen spec: run `xcodegen` in this folder to create MarbleJam.xcodeproj
name: MarbleJam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  MarbleJam:
    type: application
    platform: iOS
    sources:
      - MarbleJam
      - path: MarbleJamBackgrounds      # made by tools/prepare_backgrounds.swift, kept out of git
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.marblejam
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-halloween AppIcon-thanksgiving AppIcon-christmas"   # holiday icons, switched by AppIcons
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Marble Jam
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"          # laying out songs and rendering notes is ~30x slower unoptimised; nobody steps through this code
  MarbleJamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MarbleJamTests]
    dependencies:
      - target: MarbleJam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  MarbleJam:
    build:
      targets:
        MarbleJam: all
        MarbleJamTests: [test]
    test:
      targets: [MarbleJamTests]
