# Builds the app and runs the unit tests on an iPhone simulator, for every pull request and every push to main.
name: iOS tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted(devices, key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "iOS" in runtime]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          test -n "$UDID" || { echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MarbleJam.xcodeproj \
            -scheme MarbleJam \
            -destination "id=$SIMULATOR" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*will never|Test Case .* failed|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Keep the results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 7
