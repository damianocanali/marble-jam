# Builds the app and runs the unit tests on an iPhone simulator, for every pull request and every push to main.
# Signed "to run locally" (ad hoc, no certificates needed): Apple's StoreKit test session needs a signed app to attach to.
name: iOS tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for runtime in sorted(devices, key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "iOS" in runtime]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          test -n "$UDID" || { echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MarbleJam.xcodeproj \
            -scheme MarbleJam \
            -destination "id=$SIMULATOR,arch=arm64" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee build.log | grep --line-buffered -E "error:|\*\* (BUILD|TEST BUILD)|^SwiftCompile |^CompileSwift " || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log

      - name: Test
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MarbleJam.xcodeproj \
            -scheme MarbleJam \
            -destination "id=$SIMULATOR,arch=arm64" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee test.log | grep --line-buffered -E "error:|Test Case .* (passed|failed|skipped)|Test Suite .* (passed|failed)|Executed|Restarting after|exceeded|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" test.log

      - name: Keep the results when something fails
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            TestResults.xcresult
            build.log
            test.log
          retention-days: 7
